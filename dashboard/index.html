<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATHOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #040407;
  --surface: #07070c;
  --border: #14142a;
  --text: #7878a0;
  --text-dim: #36365a;
  --text-bright: #a8a8c8;
  --green: #00ffa8;
  --green-dim: #00aa70;
  --gold: #ffd700;
  --cyan: #00e5ff;
  --yellow: #ffeb3b;
  --orange: #ff9800;
  --red: #ff3d00;
  --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --font-display: 'Cinzel', serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-body: 'Inter', sans-serif;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  cursor: crosshair;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,255,168,0.004) 0px,
    transparent 1px,
    transparent 3px,
    rgba(0,255,168,0.004) 4px
  );
}

/* ── Header ────────────────────────────────────── */
.header {
  text-align: center;
  padding: 40px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-family: var(--font-display);
  font-size: 42px;
  letter-spacing: 16px;
  color: var(--green);
  text-shadow: 0 0 20px rgba(0,255,168,0.3);
  margin-bottom: 6px;
}
.header .subtitle {
  color: var(--text-dim);
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
}
.header .version {
  color: var(--text-dim);
  font-size: 11px;
  margin-top: 4px;
}

/* ── Tabs ──────────────────────────────────────── */
.tabs {
  display: flex;
  justify-content: center;
  gap: 0;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 12px 32px;
  cursor: pointer;
  color: var(--text-dim);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  font-family: var(--mono);
  font-size: 13px;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.tab:hover { color: var(--text); }
.tab.active {
  color: var(--green);
  border-bottom-color: var(--green);
}

/* ── Main content ──────────────────────────────── */
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 30px 20px;
}

/* ── Input area ────────────────────────────────── */
.input-area { margin-bottom: 20px; }
.input-area label {
  display: block;
  color: var(--text-dim);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.input-area textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--green);
  font-family: var(--mono);
  font-size: 14px;
  padding: 14px;
  border-radius: 4px;
  resize: vertical;
  min-height: 60px;
  outline: none;
  transition: border-color 0.2s;
}
.input-area textarea:focus {
  border-color: var(--green-dim);
}
.input-area textarea::placeholder {
  color: #333;
}

.btn {
  background: var(--green);
  color: #000;
  border: none;
  padding: 10px 28px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-radius: 3px;
  transition: all 0.15s;
  margin-top: 10px;
}
.btn:hover { background: #33ffbb; box-shadow: 0 0 15px rgba(0,255,168,0.3); }
.btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

/* ── Compare layout ────────────────────────────── */
.compare-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* ── Loading ───────────────────────────────────── */
.loading {
  text-align: center;
  padding: 40px;
  display: none;
}
.loading.active { display: block; }
.loading .pulse {
  color: var(--green);
  font-size: 16px;
  letter-spacing: 4px;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* ── Results ───────────────────────────────────── */
.result {
  display: none;
  margin-top: 20px;
}
.result.active { display: block; }

/* ── Grade badge ───────────────────────────────── */
.grade-section {
  text-align: center;
  padding: 30px 0;
}
.grade-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  font-size: 48px;
  font-weight: 900;
  border: 3px solid;
  animation: gradeIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-shadow: 0 0 20px currentColor;
}
@keyframes gradeIn {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.grade-S { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 30px rgba(255,215,0,0.3); }
.grade-A { color: var(--green); border-color: var(--green); box-shadow: 0 0 30px rgba(0,255,0,0.2); }
.grade-B { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 30px rgba(0,229,255,0.2); }
.grade-C { color: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 30px rgba(255,235,59,0.2); }
.grade-D { color: var(--orange); border-color: var(--orange); box-shadow: 0 0 30px rgba(255,152,0,0.2); }
.grade-F { color: var(--red); border-color: var(--red); box-shadow: 0 0 30px rgba(255,61,0,0.2); }

.score-number {
  font-size: 20px;
  color: var(--text);
  margin-top: 10px;
}
.score-number span { font-size: 28px; font-weight: 700; }

.interpretation {
  color: var(--text-dim);
  font-size: 12px;
  margin-top: 12px;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.5;
}

/* ── Depth bar ─────────────────────────────────── */
.metric-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
  margin-top: 16px;
}
.metric-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.depth-bar-container {
  position: relative;
  height: 28px;
  background: #1a1a1a;
  border-radius: 3px;
  overflow: hidden;
}
.depth-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.depth-bar-markers {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 10px;
  color: var(--text-dim);
}
.depth-value {
  text-align: right;
  font-size: 18px;
  font-weight: 700;
  margin-top: 6px;
}

/* ── Layer profile ─────────────────────────────── */
.layer-bars {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  height: 60px;
  margin-top: 8px;
}
.layer-bar-group {
  flex: 1;
  text-align: center;
}
.layer-bar {
  width: 100%;
  border-radius: 2px 2px 0 0;
  transition: height 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  min-height: 2px;
}
.layer-bar-label {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 4px;
}
.layer-bar-value {
  font-size: 11px;
  color: var(--text);
  margin-top: 2px;
}

/* ── Stats row ─────────────────────────────────── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 16px;
}
.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px;
  text-align: center;
}
.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--green);
}
.stat-label {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
}

/* ── Compare delta ─────────────────────────────── */
.delta-section {
  text-align: center;
  padding: 20px;
  margin-top: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
}
.delta-arrow {
  font-size: 24px;
  margin: 0 8px;
}
.delta-value {
  font-size: 28px;
  font-weight: 700;
}
.delta-positive { color: var(--green); }
.delta-negative { color: var(--red); }

/* ── Footer ────────────────────────────────────── */
.footer {
  text-align: center;
  padding: 30px;
  color: #333;
  font-size: 11px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}

/* ── Compare results side by side ──────────────── */
.compare-results {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.compare-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
  text-align: center;
}
.compare-card .card-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
}
.compare-card .mini-grade {
  font-size: 36px;
  font-weight: 900;
}
.compare-card .mini-score {
  font-size: 14px;
  color: var(--text);
  margin-top: 4px;
}

.compute-time {
  text-align: right;
  font-size: 11px;
  color: #333;
  margin-top: 12px;
}
</style>
</head>
<body>

<div class="header">
  <h1>FATHOM</h1>
  <div class="subtitle">reasoning depth analysis</div>
  <div class="version">v2.0</div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="score" onclick="switchTab('score')">SCORE</button>
  <button class="tab" data-tab="compare" onclick="switchTab('compare')">COMPARE</button>
</div>

<!-- ═══ SCORE TAB ═══ -->
<div class="container" id="tab-score">
  <div class="input-area">
    <label>Enter any prompt</label>
    <textarea id="score-input" rows="3" placeholder="Why does fire spread once it starts?"></textarea>
    <button class="btn" id="score-btn" onclick="runScore()">ANALYZE</button>
  </div>

  <div class="loading" id="score-loading">
    <div class="pulse">ANALYZING...</div>
  </div>

  <div class="result" id="score-result">
    <div class="grade-section">
      <div class="grade-badge" id="grade-badge"></div>
      <div class="score-number"><span id="score-value"></span>/100</div>
      <div class="interpretation" id="score-interpretation"></div>
    </div>

    <div class="metric-section">
      <div class="metric-label">Depth Score <span style="font-size:10px;color:#444">(lower = deeper reasoning)</span></div>
      <div class="depth-bar-container">
        <div class="depth-bar-fill" id="depth-bar"></div>
      </div>
      <div class="depth-bar-markers">
        <span>7.0 deep</span>
        <span>8.0</span>
        <span>9.0</span>
        <span>9.5 shallow</span>
      </div>
      <div class="depth-value" id="depth-value"></div>
    </div>

    <div class="metric-section">
      <div class="metric-label">Layer Activation Profile</div>
      <div class="layer-bars">
        <div class="layer-bar-group">
          <div class="layer-bar" id="bar-early" style="background:var(--green)"></div>
          <div class="layer-bar-label">EARLY</div>
          <div class="layer-bar-value" id="val-early"></div>
        </div>
        <div class="layer-bar-group">
          <div class="layer-bar" id="bar-mid" style="background:var(--cyan)"></div>
          <div class="layer-bar-label">MID</div>
          <div class="layer-bar-value" id="val-mid"></div>
        </div>
        <div class="layer-bar-group">
          <div class="layer-bar" id="bar-late" style="background:var(--orange)"></div>
          <div class="layer-bar-label">LATE</div>
          <div class="layer-bar-value" id="val-late"></div>
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-value" id="stat-entropy"></div>
        <div class="stat-label">Entropy</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-features"></div>
        <div class="stat-label">Features</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-wdepth"></div>
        <div class="stat-label">W. Depth</div>
      </div>
    </div>

    <div class="compute-time" id="compute-time"></div>
  </div>
</div>

<!-- ═══ COMPARE TAB ═══ -->
<div class="container" id="tab-compare" style="display:none">
  <div class="compare-row">
    <div class="input-area">
      <label>Surface prompt</label>
      <textarea id="compare-surface" rows="3" placeholder="What is DNA?"></textarea>
    </div>
    <div class="input-area">
      <label>Insight prompt</label>
      <textarea id="compare-insight" rows="3" placeholder="Why does DNA replicate?"></textarea>
    </div>
  </div>
  <button class="btn" id="compare-btn" onclick="runCompare()">COMPARE</button>

  <div class="loading" id="compare-loading">
    <div class="pulse">ANALYZING...</div>
  </div>

  <div class="result" id="compare-result">
    <div class="compare-results">
      <div class="compare-card">
        <div class="card-label">Surface</div>
        <div class="mini-grade" id="cmp-grade-surface"></div>
        <div class="mini-score" id="cmp-score-surface"></div>
      </div>
      <div class="compare-card">
        <div class="card-label">Insight</div>
        <div class="mini-grade" id="cmp-grade-insight"></div>
        <div class="mini-score" id="cmp-score-insight"></div>
      </div>
    </div>

    <div class="delta-section">
      <span style="color:var(--text-dim);font-size:12px">DEPTH DELTA</span><br>
      <span class="delta-value" id="cmp-delta"></span>
      <div id="cmp-delta-text" style="color:var(--text-dim);font-size:12px;margin-top:8px"></div>
    </div>

    <div class="compute-time" id="compare-compute-time"></div>
  </div>
</div>

<div class="footer">FATHOM v2.0 &mdash; local only &mdash; nothing leaves this machine</div>

<script src="/static/app.js"></script>
</body>
</html>
