<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATHOM — Request Access</title>
<meta name="description" content="Request early access to Fathom. Measure how deeply AI reasons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --void: #050508;
  --abyss: #08080e;
  --border: #161628;
  --border-subtle: #12121f;
  --text: #8888a0;
  --text-dim: #3e3e58;
  --glow: #00ffa8;
  --glow-dim: #00885a;
  --white: #d8d8e8;
  --red: #ff3355;

  --font-display: 'Cinzel', serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
}

body {
  background: var(--void);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  overflow: hidden;
}

/* Scanline */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent 0px, transparent 2px,
    rgba(0, 255, 168, 0.006) 2px, rgba(0, 255, 168, 0.006) 3px
  );
  pointer-events: none;
  z-index: 9999;
}

::selection {
  background: rgba(0, 255, 168, 0.15);
  color: var(--white);
}

/* Rings */
.ring {
  position: fixed;
  top: 50%;
  left: 50%;
  border-radius: 50%;
  border: 1px solid;
  pointer-events: none;
}

.ring-1 {
  width: 500px; height: 500px;
  transform: translate(-50%, -50%);
  border-color: rgba(0, 255, 168, 0.02);
  animation: ring 35s linear infinite;
}

.ring-2 {
  width: 320px; height: 320px;
  transform: translate(-50%, -50%);
  border-color: rgba(0, 200, 238, 0.015);
  animation: ring 24s linear infinite reverse;
}

@keyframes ring {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

.container {
  max-width: 480px;
  width: 100%;
  position: relative;
  z-index: 10;
}

.header {
  text-align: center;
  margin-bottom: 56px;
}

.header h1 {
  font-family: var(--font-display);
  font-size: clamp(40px, 8vw, 64px);
  font-weight: 400;
  letter-spacing: clamp(10px, 3vw, 24px);
  color: var(--glow);
  text-shadow: 0 0 60px rgba(0, 255, 168, 0.12), 0 0 140px rgba(0, 255, 168, 0.04);
  margin-bottom: 10px;
  animation: breathe 7s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { text-shadow: 0 0 60px rgba(0, 255, 168, 0.12), 0 0 140px rgba(0, 255, 168, 0.04); }
  50% { text-shadow: 0 0 80px rgba(0, 255, 168, 0.18), 0 0 180px rgba(0, 255, 168, 0.06); }
}

.header .label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 6px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 28px;
}

.header .tagline {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 300;
  font-style: italic;
  color: var(--text);
}

/* Form */
.form-section {
  background: var(--abyss);
  border: 1px solid var(--border-subtle);
  padding: 36px 32px;
  margin-bottom: 20px;
}

.form-section label {
  display: block;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.input-row {
  display: flex;
  gap: 10px;
}

.input-row input {
  flex: 1;
  background: var(--void);
  border: 1px solid var(--border);
  color: var(--glow);
  font-family: var(--font-mono);
  font-size: 14px;
  padding: 15px 18px;
  outline: none;
  transition: all 0.4s;
}

.input-row input:focus {
  border-color: var(--glow-dim);
  box-shadow: 0 0 30px rgba(0, 255, 168, 0.04);
}

.input-row input::placeholder { color: var(--text-dim); }

.input-row button {
  background: transparent;
  border: 1px solid var(--glow);
  color: var(--glow);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 3px;
  padding: 15px 28px;
  cursor: pointer;
  transition: all 0.5s;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}

.input-row button::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--glow);
  opacity: 0;
  transition: opacity 0.5s;
}

.input-row button:hover::before { opacity: 1; }
.input-row button:hover { color: var(--void); }
.input-row button span { position: relative; z-index: 1; }
.input-row button:disabled { opacity: 0.3; cursor: not-allowed; }

.status {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 12px;
  margin-top: 16px;
  min-height: 20px;
}

.status.success { color: var(--glow); }
.status.error { color: var(--red); }

.counter {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.counter .number { color: var(--glow-dim); }

/* Footer */
.footer {
  text-align: center;
  margin-top: 56px;
}

.footer a {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--text-dim);
  text-decoration: none;
  transition: color 0.4s;
}

.footer a:hover { color: var(--glow-dim); }

.footer .legal {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  opacity: 0.3;
  margin-top: 12px;
  letter-spacing: 1px;
}

@media (max-width: 480px) {
  .input-row { flex-direction: column; }
}
</style>
</head>
<body>

<div class="ring ring-1"></div>
<div class="ring ring-2"></div>

<div class="container">
  <div class="header">
    <h1>FATHOM</h1>
    <div class="label">Request Access</div>
    <div class="tagline">Measure how deeply AI reasons.</div>
  </div>

  <div class="form-section">
    <label>Email Address</label>
    <div class="input-row">
      <input type="email" id="email" placeholder="you@organization.com" autocomplete="email">
      <button id="submit-btn" onclick="submit()"><span>REQUEST</span></button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="counter">
    <span class="number" id="count">&mdash;</span> on the list
  </div>

  <div class="footer">
    <a href="/fathom">DARKFLOBI &middot; FATHOM</a>
    <div class="legal">Patent Pending US 64/020,489 &middot; 15 claims</div>
  </div>
</div>

<script>
const API = window.location.origin;

async function loadCount() {
  try {
    const res = await fetch(API + '/waitlist/count');
    if (res.ok) {
      const data = await res.json();
      document.getElementById('count').textContent = data.count;
    }
  } catch (e) {}
}

async function submit() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status');

  if (!email || !email.includes('@')) {
    status.textContent = 'Enter a valid email.';
    status.className = 'status error';
    return;
  }

  btn.disabled = true;
  btn.querySelector('span').textContent = '...';
  status.textContent = '';

  try {
    const res = await fetch(API + '/waitlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (res.ok) {
      status.textContent = "We'll be in touch.";
      status.className = 'status success';
      document.getElementById('email').value = '';
      loadCount();
    } else {
      status.textContent = data.detail || 'Something went wrong.';
      status.className = 'status error';
    }
  } catch (e) {
    status.textContent = 'Connection failed. Try again.';
    status.className = 'status error';
  }

  btn.disabled = false;
  btn.querySelector('span').textContent = 'REQUEST';
}

document.getElementById('email').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submit();
});

loadCount();
</script>

</body>
</html>
