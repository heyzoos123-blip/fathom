<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATHOM — Request Access</title>
<meta name="description" content="Request early access to Fathom. Measure how deeply AI reasons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --void: #040407;
  --abyss: #07070c;
  --deep: #0b0b14;
  --border: #14142a;
  --border-subtle: #0f0f1e;
  --text: #7878a0;
  --text-bright: #a8a8c8;
  --text-dim: #36365a;
  --glow: #00ffa8;
  --glow-mid: #00cc88;
  --glow-dim: #007a52;
  --glow-ghost: rgba(0, 255, 168, 0.03);
  --cyan: #00c8ee;
  --white: #cccce0;
  --red: #ff3355;

  --font-display: 'Cinzel', 'Times New Roman', serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
}

body {
  background: var(--void);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  min-height: 100vh;
  cursor: crosshair;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  overflow: hidden;
}

::selection {
  background: rgba(0, 255, 168, 0.12);
  color: var(--white);
}

a, button, input { cursor: crosshair; }
a:hover, button:hover { cursor: crosshair; }

/* Scanline */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent 0px, transparent 3px,
    rgba(0, 255, 168, 0.004) 3px, rgba(0, 255, 168, 0.004) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* Rings */
.ring {
  position: fixed;
  top: 50%;
  left: 50%;
  border-radius: 50%;
  border: 1px solid;
  pointer-events: none;
}

.ring-1 {
  width: 500px; height: 500px;
  transform: translate(-50%, -50%);
  border-color: rgba(0, 255, 168, 0.02);
  animation: ring 35s linear infinite;
}

.ring-2 {
  width: 320px; height: 320px;
  transform: translate(-50%, -50%);
  border-color: rgba(0, 200, 238, 0.015);
  animation: ring 24s linear infinite reverse;
}

@keyframes ring {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

.container {
  max-width: 480px;
  width: 100%;
  position: relative;
  z-index: 10;
}

.header {
  text-align: center;
  margin-bottom: 56px;
}

.header h1 {
  font-family: var(--font-display);
  font-size: clamp(40px, 8vw, 64px);
  font-weight: 400;
  letter-spacing: clamp(10px, 3vw, 24px);
  color: var(--glow);
  text-shadow: 0 0 60px rgba(0, 255, 168, 0.12), 0 0 140px rgba(0, 255, 168, 0.04);
  margin-bottom: 10px;
  animation: breathe 7s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { text-shadow: 0 0 60px rgba(0, 255, 168, 0.12), 0 0 140px rgba(0, 255, 168, 0.04); }
  50% { text-shadow: 0 0 80px rgba(0, 255, 168, 0.18), 0 0 180px rgba(0, 255, 168, 0.06); }
}

.header .label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 6px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 28px;
}

.header .tagline {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 300;
  font-style: italic;
  color: var(--text);
}

/* Form */
.form-section {
  background: var(--abyss);
  border: 1px solid var(--border-subtle);
  padding: 36px 32px;
  margin-bottom: 20px;
}

.form-section label {
  display: block;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.input-row {
  display: flex;
  gap: 10px;
}

.input-row input {
  flex: 1;
  background: var(--void);
  border: 1px solid var(--border);
  color: var(--glow);
  font-family: var(--font-mono);
  font-size: 14px;
  padding: 15px 18px;
  outline: none;
  transition: all 0.4s;
}

.input-row input:focus {
  border-color: var(--glow-dim);
  box-shadow: 0 0 30px rgba(0, 255, 168, 0.04);
}

.input-row input::placeholder { color: var(--text-dim); }

.input-row button {
  background: transparent;
  border: 1px solid var(--glow);
  color: var(--glow);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 3px;
  padding: 15px 28px;
  cursor: pointer;
  transition: all 0.5s;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}

.input-row button::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--glow);
  opacity: 0;
  transition: opacity 0.5s;
}

.input-row button:hover::before { opacity: 1; }
.input-row button:hover { color: var(--void); }
.input-row button span { position: relative; z-index: 1; }
.input-row button:disabled { opacity: 0.3; cursor: not-allowed; }

.status {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 12px;
  margin-top: 16px;
  min-height: 20px;
}

.status.success { color: var(--glow); }
.status.error { color: var(--red); }

.counter {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.counter .number { color: var(--glow-dim); }


/* ── Nav ───────────────────────────────────────── */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: rgba(4, 4, 7, 0.92);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-bottom: 1px solid var(--border-subtle);
}
.nav-inner {
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 60px;
  padding: 0 40px;
}
.nav-brand {
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 10px;
  color: var(--glow);
  text-decoration: none;
  text-shadow: 0 0 40px rgba(0, 255, 168, 0.15);
  transition: text-shadow 0.6s;
}
.nav-brand:hover { text-shadow: 0 0 60px rgba(0, 255, 168, 0.3); }
.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}
.nav-links a {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-dim);
  text-decoration: none;
  transition: color 0.5s;
}
.nav-links a:hover { color: var(--glow-dim); }

/* ── Standard Footer ──────────────────────────── */
footer {
  border-top: 1px solid var(--border-subtle);
  padding: 56px 40px;
  text-align: center;
}
.footer-ip {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
  opacity: 0.6;
  margin-bottom: 20px;
}
.footer-brand {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 6px;
  color: var(--text-dim);
  opacity: 0.35;
  margin-bottom: 12px;
}
.footer-epitaph {
  font-family: var(--font-serif);
  font-size: 14px;
  font-style: italic;
  font-weight: 300;
  color: var(--text-dim);
  opacity: 0.25;
  margin-bottom: 28px;
}
.footer-links {
  display: flex;
  gap: 28px;
  justify-content: center;
  flex-wrap: wrap;
}
.footer-links a {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  text-decoration: none;
  opacity: 0.35;
  transition: opacity 0.4s, color 0.4s;
}
.footer-links a:hover { opacity: 0.7; color: var(--glow-dim); }

@media (max-width: 480px) {
  .input-row { flex-direction: column; }
  .nav-links { display: none; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/fathom" class="nav-brand">FATHOM</a>
    <ul class="nav-links">
      <li><a href="/fathom/blog">Research</a></li>
      <li><a href="/fathom/demo">Try It</a></li>
      <li><a href="#access">Access</a></li>
    </ul>
  </div>
</nav>

<div class="ring ring-1"></div>
<div class="ring ring-2"></div>

<div class="container">
  <div class="header">
    <h1>FATHOM</h1>
    <div class="label">Request Access</div>
    <div class="tagline">Measure how deeply AI reasons.</div>
  </div>

  <div class="form-section">
    <label>Email Address</label>
    <div class="input-row">
      <input type="email" id="email" placeholder="you@organization.com" autocomplete="email">
      <button id="submit-btn" onclick="submit()"><span>REQUEST</span></button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="counter">
    <span class="number" id="count">&mdash;</span> on the list
  </div>

  </div>
</div>

<footer>
  <div class="footer-ip">Patent Pending US 64/020,489 &middot; 15 claims &middot; Priority March 29, 2026</div>
  <div class="footer-brand">DARKFLOBI</div>
  <div class="footer-epitaph">Built in the dark. Measured in the light.</div>
  <div class="footer-links">
    <a href="/fathom/blog">Research</a>
    <a href="/fathom/demo">Demo</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/fathom/leaderboard">Leaderboard</a>
    <a href="/fathom/investors">Investors</a>
  </div>
</footer>

<script>
const API = window.location.origin;

async function loadCount() {
  try {
    const res = await fetch(API + '/waitlist/count');
    if (res.ok) {
      const data = await res.json();
      document.getElementById('count').textContent = data.count;
    }
  } catch (e) {}
}

async function submit() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status');

  if (!email || !email.includes('@')) {
    status.textContent = 'Enter a valid email.';
    status.className = 'status error';
    return;
  }

  btn.disabled = true;
  btn.querySelector('span').textContent = '...';
  status.textContent = '';

  try {
    const res = await fetch(API + '/waitlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (res.ok) {
      status.textContent = "We'll be in touch.";
      status.className = 'status success';
      document.getElementById('email').value = '';
      loadCount();
    } else {
      status.textContent = data.detail || 'Something went wrong.';
      status.className = 'status error';
    }
  } catch (e) {
    status.textContent = 'Connection failed. Try again.';
    status.className = 'status error';
  }

  btn.disabled = false;
  btn.querySelector('span').textContent = 'REQUEST';
}

document.getElementById('email').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submit();
});

loadCount();
</script>

</body>
</html>
